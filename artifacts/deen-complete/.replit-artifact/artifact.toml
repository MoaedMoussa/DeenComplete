kind = "mobile"
previewPath = "/"
title = "Deen Complete"
version = "1.0.0"
id = "artifacts/deen-complete"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25432

[services.development]
run = "pnpm --filter @workspace/deen-complete run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deen-complete", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/deen-complete", "run", "serve" ]

[services.env]
PORT = "25432"
BASE_PATH = "/"
